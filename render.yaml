services:
  - type: web
    name: server-resto-api
    env: node
    plan: free
    buildCommand: |
      bun install --frozen-lockfile
      bun run build
      npx prisma generate
    startCommand: bun start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "mongodb+srv://cesaristos5:D5NfqTbJGXpybjqL@k2ngrouptest.8xgdo.mongodb.net/server_resto?retryWrites=true&w=majority&appName=k2ngrouptest"
      - key: ALLOWED_ORIGINS
        value: "https://server-resto-client.onrender.com,http://localhost:3000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: APP_URL
        value: https://server-resto-client.onrender.com
      - key: API_PREFIX
        value: /api/v1
